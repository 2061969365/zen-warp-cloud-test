name: warp-setup-test
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup WARP with apt refresh
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 1 \
            -o /tmp/cloudflare-warp.deb \
            https://pkg.cloudflareclient.com/pool/noble/main/c/cloudflare-warp/cloudflare-warp_2026.8.2115.0_amd64.deb
          sudo apt-get -o Acquire::Retries=3 update -y
          if ! sudo dpkg -i /tmp/cloudflare-warp.deb; then
            echo "installing missing dependencies..."
            sudo apt-get -o Acquire::Retries=3 install -f -y --fix-missing
            sudo dpkg -i /tmp/cloudflare-warp.deb
          fi
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode warp+doh
          sudo warp-cli --accept-tos connect
          sleep 3
          curl -s --max-time 8 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|warp=|loc=' || true
