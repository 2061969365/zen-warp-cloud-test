name: warp-extract-test
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup WARP via extracted binaries
        run: |
          set -euo pipefail
          t0=$SECONDS
          curl -fsSL --retry 3 --retry-delay 1 \
            -o /tmp/cloudflare-warp.deb \
            https://pkg.cloudflareclient.com/pool/noble/main/c/cloudflare-warp/cloudflare-warp_2026.8.2115.0_amd64.deb
          echo "download=$((SECONDS-t0))s size=$(stat -c%s /tmp/cloudflare-warp.deb)"

          t1=$SECONDS
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-3 libnss3 libpcap0.8 libtss2-esys-3.0.2-0t64 libtss2-tctildr0t64 \
            iproute2 nftables libcap2-bin ca-certificates >/dev/null
          echo "deps=$((SECONDS-t1))s"

          t2=$SECONDS
          rm -rf /tmp/warp-extract
          mkdir -p /tmp/warp-extract
          dpkg-deb --fsys-tarfile /tmp/cloudflare-warp.deb \
            | tar -x -C /tmp/warp-extract ./bin/warp-svc ./bin/warp-cli ./lib/systemd/system/warp-svc.service
          sudo install -m 0755 /tmp/warp-extract/bin/warp-svc /usr/bin/warp-svc
          sudo install -m 0755 /tmp/warp-extract/bin/warp-cli /usr/bin/warp-cli
          sudo install -m 0644 /tmp/warp-extract/lib/systemd/system/warp-svc.service /etc/systemd/system/warp-svc.service
          sudo systemctl daemon-reload
          echo "extract=$((SECONDS-t2))s"

          t3=$SECONDS
          sudo systemctl enable --now warp-svc
          ready=0
          for i in $(seq 1 60); do
            if sudo warp-cli --accept-tos status >/dev/null 2>&1; then ready=1; break; fi
            sleep 0.25
          done
          echo "daemon_ready=$ready after=$((SECONDS-t3))s"

          t4=$SECONDS
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode warp+doh
          sudo warp-cli --accept-tos connect
          connected=0
          for i in $(seq 1 60); do
            st="$(sudo warp-cli --accept-tos status 2>&1 || true)"
            echo "status[$i] $((SECONDS-t4))s: $(printf '%s' "$st" | tr '\n' ' ')"
            if printf '%s' "$st" | grep -qE 'Status update: Connected|warp=on'; then connected=1; break; fi
            sleep 0.5
          done
          echo "connect_ready=$connected after=$((SECONDS-t4))s"
          if [ "$connected" != 1 ]; then
            sudo journalctl -u warp-svc -n 120 --no-pager || true
            exit 1
          fi

          echo "--- trace ---"
          for i in $(seq 1 10); do
            tr="$(curl -s --max-time 5 https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null || true)"
            echo "trace[$i] $((SECONDS-t4))s: $(printf '%s' "$tr" | grep -E 'ip=|warp=|loc=|colo=' | tr '\n' ' ')"
            if printf '%s' "$tr" | grep -q 'warp=on'; then break; fi
            sleep 1
          done
          echo "total=$((SECONDS-t0))s"
